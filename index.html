<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniMax H3 Image Edit Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #aaa; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; }
    input[type="file"] { margin-top: 6px; width: 100%; padding: 8px; background: #1e1e1e; border: 1px dashed #444; border-radius: 6px; color: #ccc; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: #ddd; cursor: pointer; }
    .checkbox-row input { width: auto; margin: 0; }
    #preview { max-height: 220px; margin-top: 10px; border-radius: 6px; border: 1px solid #333; display: none; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    .sub-btn { margin-top: 8px; background: #262626; color: #ddd; border: 1px solid #444; font-weight: 600; font-size: 13px; padding: 10px; display: none; }
    #status { margin-top: 12px; font-size: 13px; color: #7dd3fc; white-space: pre-wrap; line-height: 1.5; }
    #result img { width: 100%; margin-top: 16px; border-radius: 8px; border: 1px solid #333; }
    .download-btn { display: inline-block; margin-top: 10px; padding: 10px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>MiniMax H3 Studio (RunPod)</h2>

  <label>Cloudflare Worker 주소</label>
  <input type="text" id="workerUrl" placeholder="https://my-ai-proxy.xxx.workers.dev" />

  <label>참조 이미지 업로드 (필수 - Image Edit 워크플로우)</label>
  <input type="file" id="imageFile" accept="image/*" />
  <img id="preview" alt="미리보기" />

  <label>프롬프트 (영어 권장)</label>
  <textarea id="positive" rows="4" placeholder="원하는 편집 또는 생성 내용을 영어로 입력하세요."></textarea>

  <div class="row">
    <div>
      <label>해상도 (속도)</label>
      <select id="megapixels">
        <option value="1" selected>1MP (빠름)</option>
        <option value="2">2MP (균형)</option>
        <option value="4">4MP (고화질/느림)</option>
      </select>
    </div>
    <div><label>Steps (기본 6)</label><input id="steps" type="number" value="6" /></div>
    <div><label>CFG (기본 2.1)</label><input id="cfg" type="number" step="0.1" value="2.1" /></div>
  </div>

  <label class="checkbox-row">
    <input type="checkbox" id="enablePE" />
    프롬프트 자동 확장 (Enable PE - Qwen3-VL) 사용 *(체크 시 시간 증가)*
  </label>

  <button id="genBtn" onclick="generate()">이미지 생성</button>
  <button id="resumeBtn" class="sub-btn" onclick="resumeLastJob()">이전 작업 결과 다시 불러오기</button>
  <div id="status"></div>
  <div id="result"></div>

  <script>
    const BASE_WORKFLOW = {
      "9": {
        "inputs": {
          "filename_prefix": "image_minimax_h3_image_edit",
          "images": ["42", 0]
        },
        "class_type": "SaveImage"
      },
      "29": {
        "inputs": {
          "unet_name": "minimax_h3_image_pruned_int8_convrot.safetensors",
          "weight_dtype": "default"
        },
        "class_type": "UNETLoader"
      },
      "30": {
        "inputs": {
          "clip_name": "qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors",
          "type": "minimax",
          "device": "default"
        },
        "class_type": "CLIPLoader"
      },
      "31": {
        "inputs": {
          "vae_name": "minimax_h3_image_vae_fp16.safetensors"
        },
        "class_type": "VAELoader"
      },
      "32": {
        "inputs": {
          "prompt": ["37", 0],
          "width": ["50", 0],
          "height": ["50", 1],
          "clip": ["30", 0],
          "vae": ["31", 0],
          "images.image_1": ["48", 0]
        },
        "class_type": "MiniMaxH3ImageConditioning"
      },
      "33": {
        "inputs": {
          "conditioning": ["32", 0]
        },
        "class_type": "ConditioningZeroOut"
      },
      "34": {
        "inputs": {
          "prompt": ["40", 0],
          "max_length": 8196,
          "sampling_mode": "on",
          "sampling_mode.temperature": 1,
          "sampling_mode.top_k": 20,
          "sampling_mode.top_p": 0.95,
          "sampling_mode.min_p": 0,
          "sampling_mode.repetition_penalty": 1,
          "sampling_mode.presence_penalty": 0,
          "sampling_mode.seed": 0,
          "thinking": true,
          "use_default_template": true,
          "mtp": "auto",
          "clip": ["30", 0],
          "images.image1": ["48", 0],
          "system_prompt": ["36", 0]
        },
        "class_type": "TextGenerateV2"
      },
      "36": {
        "inputs": {
          "value": "Reason in the thinking section first. The visible final content must be exactly one JSON object with exactly two keys: expanded_caption and aspect_ratio. Every ASCII double quotation mark used as caption content inside expanded_caption must be serialized as the JSON escape sequence \\\". Do not output text outside that object."
        },
        "class_type": "PrimitiveStringMultiline"
      },
      "37": {
        "inputs": {
          "source": ["41", 0]
        },
        "class_type": "PreviewAny"
      },
      "38": {
        "inputs": {
          "seed": 30676492592978,
          "steps": 6,
          "cfg": 2.1,
          "sampler_name": "euler",
          "scheduler": "simple",
          "denoise": 1,
          "model": ["29", 0],
          "positive": ["32", 0],
          "negative": ["33", 0],
          "latent_image": ["32", 1]
        },
        "class_type": "KSampler"
      },
      "39": {
        "inputs": {
          "value": "You are an expert at enhancing a short image-editing instruction into a rich, vivid, reference-conditioned description of the intended finished target image.\n\nReturn exactly one valid JSON object with exactly these two keys, both with string values:\n{\"expanded_caption\":\"COMPLETE_DESCRIPTION\",\"target_aspect_ratio\":\"W:H\"}\nOutput only the required two-field JSON object.\nUser input: {input text}\noutput_text:\n"
        },
        "class_type": "PrimitiveStringMultiline"
      },
      "40": {
        "inputs": {
          "string": ["39", 0],
          "find": "{input text}",
          "replace": ["43", 0]
        },
        "class_type": "StringReplace"
      },
      "41": {
        "inputs": {
          "switch": ["61", 0],
          "on_false": ["43", 0],
          "on_true": ["44", 0]
        },
        "class_type": "ComfySwitchNode"
      },
      "42": {
        "inputs": {
          "samples": ["38", 0],
          "vae": ["31", 0]
        },
        "class_type": "VAEDecode"
      },
      "43": {
        "inputs": {
          "value": ""
        },
        "class_type": "PrimitiveStringMultiline"
      },
      "44": {
        "inputs": {
          "json_string": ["34", 0],
          "key": "expanded_caption"
        },
        "class_type": "JsonExtractString"
      },
      "45": {
        "inputs": {
          "image": "input_ref.png"
        },
        "class_type": "LoadImage"
      },
      "48": {
        "inputs": {
          "resize_type": "scale to multiple",
          "resize_type.multiple": 32,
          "scale_method": "area",
          "input": ["56", 0]
        },
        "class_type": "ResizeImageMaskNode"
      },
      "50": {
        "inputs": {
          "image": ["48", 0]
        },
        "class_type": "GetImageSize"
      },
      "56": {
        "inputs": {
          "resize_type": "scale total pixels",
          "resize_type.megapixels": 1,
          "scale_method": "area",
          "input": ["45", 0]
        },
        "class_type": "ResizeImageMaskNode"
      },
      "61": {
        "inputs": {
          "value": false
        },
        "class_type": "PrimitiveBoolean"
      }
    };

    const workerInput = document.getElementById("workerUrl");
    const resumeBtn = document.getElementById("resumeBtn");
    workerInput.value = localStorage.getItem("workerUrl") || "";
    workerInput.addEventListener("input", () => {
      localStorage.setItem("workerUrl", workerInput.value.trim());
    });

    if (localStorage.getItem("lastJobId") && workerInput.value.trim()) {
      resumeBtn.style.display = "block";
    }

    let uploadedBase64 = null;
    let uploadedFileName = "input_ref.png";
    let activePollToken = 0;

    document.getElementById("imageFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadedFileName = "input_" + Date.now() + ".png";
      const reader = new FileReader();
      reader.onload = () => {
        const preview = document.getElementById("preview");
        preview.src = reader.result;
        preview.style.display = "block";
        uploadedBase64 = reader.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    });

    function extractImageSrc(output) {
      if (!output) return null;

      // 1) worker-comfyui 5.x 표준 형식: output.images = [{ data: "...", type: "base64" }]
      if (Array.isArray(output.images) && output.images.length > 0) {
        const img = output.images[output.images.length - 1];
        const raw = typeof img === "string" ? img : (img.data || img.url || img.image);
        if (raw) {
          if (raw.startsWith("http") || raw.startsWith("data:image")) return raw;
          return `data:image/png;base64,${raw}`;
        }
      }

      // 2) 구버전/단일 문자열 형식: output.message
      if (typeof output.message === "string" && output.message.length > 100) {
        if (output.message.startsWith("http") || output.message.startsWith("data:image")) {
          return output.message;
        }
        return `data:image/png;base64,${output.message}`;
      }

      return null;
    }

    async function pollStatus(workerUrl, jobId, startTime) {
      const myToken = ++activePollToken;
      const btn = document.getElementById("genBtn");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      let retryCount = 0;

      btn.disabled = true;

      while (myToken === activePollToken) {
        const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
        const min = Math.floor(elapsedSec / 60);
        const sec = elapsedSec % 60;
        const timeText = min > 0 ? `${min}분 ${sec}초` : `${sec}초`;

        try {
          const pollRes = await fetch(`${workerUrl}/status/${jobId}`);
          if (!pollRes.ok) {
            throw new Error(`HTTP ${pollRes.status}`);
          }
          const job = await pollRes.json();
          retryCount = 0;

          if (job.status === "IN_QUEUE") {
            status.textContent = `클라우드 GPU 대기 중... (${timeText} 경과)\n작업 ID: ${jobId}`;
          } else if (job.status === "IN_PROGRESS") {
            status.textContent = `GPU에서 모델 로딩 및 이미지 생성 중... (${timeText} 경과)\n작업 ID: ${jobId}`;
          } else if (job.status === "COMPLETED") {
            const src = extractImageSrc(job.output);
            if (!src) {
              throw new Error("응답에 이미지 데이터가 없습니다: " + JSON.stringify(job.output).slice(0, 200));
            }
            result.innerHTML = `
              <img src="${src}" alt="Generated" />
              <a class="download-btn" href="${src}" download="minimax_${Date.now()}.png">이미지 다운로드</a>
            `;
            status.textContent = `생성 완료! (총 ${timeText} 소요)`;
            btn.disabled = false;
            return;
          } else if (job.status === "FAILED" || job.status === "CANCELLED" || job.status === "TIMED_OUT") {
            status.textContent = `생성 실패 (${job.status}): ${job.error || "RunPod 로그를 확인하세요."}`;
            btn.disabled = false;
            return;
          }
        } catch (pollErr) {
          retryCount++;
          status.textContent = `네트워크 일시 끊김 — 자동 재연결 중 (${retryCount}회)... (${timeText} 경과)\n사유: ${pollErr.message}`;
        }

        await new Promise((r) => setTimeout(r, 3500));
      }
    }

    async function resumeLastJob() {
      const workerUrl = workerInput.value.trim().replace(/\/$/, "");
      const lastJobId = localStorage.getItem("lastJobId");
      if (!workerUrl || !lastJobId) return;
      document.getElementById("result").innerHTML = "";
      document.getElementById("status").textContent = `이전 작업(${lastJobId}) 상태를 조회하는 중...`;
      await pollStatus(workerUrl, lastJobId, Date.now());
    }

    async function generate() {
      const workerUrl = workerInput.value.trim().replace(/\/$/, "");
      const promptText = document.getElementById("positive").value.trim();
      const btn = document.getElementById("genBtn");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      if (!workerUrl) {
        status.textContent = "Cloudflare Worker 주소를 먼저 입력하세요.";
        return;
      }
      if (!uploadedBase64) {
        status.textContent = "참조 이미지를 먼저 업로드하세요.";
        return;
      }
      if (!promptText) {
        status.textContent = "프롬프트를 입력하세요.";
        return;
      }

      const enablePE = document.getElementById("enablePE").checked;
      const megapixels = parseFloat(document.getElementById("megapixels").value) || 1;
      const workflow = structuredClone(BASE_WORKFLOW);

      workflow["43"].inputs.value = promptText;
      workflow["38"].inputs.seed = Math.floor(Math.random() * 1e14);
      workflow["38"].inputs.steps = Number(document.getElementById("steps").value) || 6;
      workflow["38"].inputs.cfg = Number(document.getElementById("cfg").value) || 2.1;
      workflow["56"].inputs["resize_type.megapixels"] = megapixels;
      workflow["45"].inputs.image = uploadedFileName;

      if (!enablePE) {
        // PE 비활성화 시 32번 노드에 프롬프트 직접 연결 & 불필요한 PE 노드 완전 제거
        workflow["32"].inputs.prompt = ["43", 0];
        delete workflow["34"];
        delete workflow["36"];
        delete workflow["37"];
        delete workflow["39"];
        delete workflow["40"];
        delete workflow["41"];
        delete workflow["44"];
        delete workflow["61"];
      } else {
        workflow["61"].inputs.value = true;
      }

      btn.disabled = true;
      status.textContent = "RunPod 서버에 이미지와 작업을 전송하는 중...";
      result.innerHTML = "";

      try {
        const res = await fetch(`${workerUrl}/run`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            input: {
              workflow,
              images: [
                {
                  name: uploadedFileName,
                  image: uploadedBase64
                }
              ]
            }
          })
        });
        if (!res.ok) throw new Error(`요청 실패 (HTTP ${res.status})`);
        const data = await res.json();
        if (!data.id) throw new Error("작업 ID를 받지 못했습니다.");

        localStorage.setItem("lastJobId", data.id);
        resumeBtn.style.display = "block";

        await pollStatus(workerUrl, data.id, Date.now());
      } catch (err) {
        status.textContent = "전송 오류: " + err.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
